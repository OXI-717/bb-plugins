name: CI

on:
  push:
    branches: [main]
    tags: ['*/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      cursor: ${{ steps.select.outputs.cursor }}
      session_tree: ${{ steps.select.outputs.session_tree }}
      provider_icons: ${{ steps.select.outputs.provider_icons }}
      matrix: ${{ steps.select.outputs.matrix }}
      check: ${{ steps.select.outputs.check }}
      upgrade: ${{ steps.select.outputs.upgrade }}
      upgrade_mac: ${{ steps.select.outputs.upgrade_mac }}
      op: ${{ steps.select.outputs.op }}
      archive: ${{ steps.select.outputs.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_ci_*.py' -v
      - id: select
        run: python3 scripts/ci_plan.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}

  public-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public paths and credentials
        run: python3 scripts/check_hygiene.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check plugin identity and release contract
        run: |
          node scripts/check-manifests.mjs
          node scripts/check-vpn-contract.mjs
          node --test scripts/check-manifests.test.mjs
      - name: Check documentation links
        run: python3 scripts/check_doc_refs.py

  check:
    needs: plan
    name: check (${{ matrix.os }}, ${{ matrix.plugin }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Keep the protected check name, but only assign a Mac when its tests run.
    runs-on: ${{ matrix.run && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      OXI_TEST_REMOTE_EXECUTION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.run
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.run
        with:
          node-version: ${{ (matrix.plugin == 'oxi-projects' || matrix.plugin == 'federation-pilot' || matrix.plugin == 'pool-maintenance') && '24' || '22' }}
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - name: Install dependencies
        if: matrix.run
        working-directory: plugins/${{ matrix.plugin }}
        run: npm ci ${{ matrix.plugin == 'pool-maintenance' && '--legacy-peer-deps' || '' }}
      - name: Typecheck
        if: matrix.run
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run typecheck
      - name: Test
        if: matrix.run
        working-directory: plugins/${{ matrix.plugin }}
        run: npm test
      - name: Project UI and integration tests
        if: matrix.run && (matrix.plugin == 'oxi-projects')
        working-directory: plugins/oxi-projects
        run: npx vitest run
      - name: Collector tests
        if: matrix.run && (matrix.plugin == 'automation-catalog')
        working-directory: plugins/automation-catalog/scripts
        run: python3 -m unittest discover -p 'test_catalog*.py'
      - name: Build with the published BB CLI
        if: matrix.run && (matrix.plugin != 'vpn-guard' && matrix.plugin != 'oxi-projects' && matrix.plugin != 'model-connections' && matrix.plugin != 'federation-pilot' && matrix.plugin != 'pool-maintenance')
        working-directory: plugins/${{ matrix.plugin }}
        run: npm exec --yes --package=bb-app@${{ matrix.plugin == 'account-pool-balanced' && '0.46.1' || '0.43.3' }} -- bb plugin build .
      - name: Build plugins requiring BB 0.46
        if: matrix.run && (matrix.plugin == 'vpn-guard' || matrix.plugin == 'oxi-projects' || matrix.plugin == 'model-connections' || matrix.plugin == 'federation-pilot' || matrix.plugin == 'pool-maintenance')
        working-directory: plugins/${{ matrix.plugin }}
        run: npm exec --yes --package=bb-app@${{ (matrix.plugin == 'model-connections' || matrix.plugin == 'federation-pilot' || matrix.plugin == 'pool-maintenance') && '0.46.1' || '0.46.0' }} -- bb plugin build .
      - name: Ensure checks leave tracked files clean
        if: matrix.run
        run: git diff --exit-code

  session-tree:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.plan.outputs.session_tree == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: needs.plan.outputs.session_tree == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/oxi-thread-list/package-lock.json
      - run: npm ci
        if: needs.plan.outputs.session_tree == 'true'
        working-directory: plugins/oxi-thread-list
      - run: npm run typecheck
        if: needs.plan.outputs.session_tree == 'true'
        working-directory: plugins/oxi-thread-list
      - run: npm test
        if: needs.plan.outputs.session_tree == 'true'
        working-directory: plugins/oxi-thread-list
      - run: npm exec --yes --package=bb-app@0.49.0 -- bb plugin build .
        if: needs.plan.outputs.session_tree == 'true'
        working-directory: plugins/oxi-thread-list
      - run: git diff --exit-code
        if: needs.plan.outputs.session_tree == 'true'
      - name: Report unchanged Session Tree
        if: needs.plan.outputs.session_tree != 'true'
        env:
          SELECTED: ${{ needs.plan.outputs.session_tree }}
        run: test "$SELECTED" = false

  upgrade-script:
    needs: plan
    if: needs.plan.outputs.upgrade == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.upgrade_mac == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check system Bash entrypoint
        run: |
          /bin/bash --version
          /bin/bash -n scripts/upgrade-pool.sh
          /bin/bash scripts/upgrade-pool.sh --help
      - name: Rehearse the full upgrade in sandbox
        run: /bin/bash scripts/upgrade-pool.sh --sandbox
      - name: Test upgrade without a live BB server
        run: python3 -m unittest discover -s scripts -p 'test_upgrade_*.py' -v
      - name: Test read-only Claude host diagnostics
        run: python3 -m unittest discover -s plugins/account-pool-balanced/scripts -p test_claude_host_doctor.py -v

  cursor-gateway:
    needs: plan
    if: needs.plan.outputs.cursor == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Cursor gateway with a synthetic local CLI
        run: python3 -m unittest discover -s scripts -p test_cursor_route.py -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan all fetched history
        run: /tmp/gitleaks-bin/gitleaks git --redact --no-banner --log-opts='--all' .

  auto-archive:
    needs: plan
    if: needs.plan.outputs.archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/auto-archive/package-lock.json
      - run: npm ci
        working-directory: plugins/auto-archive
      - run: npm run typecheck
        working-directory: plugins/auto-archive
      - run: npm test
        working-directory: plugins/auto-archive
      - run: npm exec --yes --package=bb-app@0.46.1 -- bb plugin build .
        working-directory: plugins/auto-archive
      - run: git diff --exit-code

  oxi-op:
    needs: plan
    if: needs.plan.outputs.op == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/oxi-op/package-lock.json
      - run: npm ci
        working-directory: plugins/oxi-op
      - run: npm run typecheck
        working-directory: plugins/oxi-op
      - run: npm test
        working-directory: plugins/oxi-op
      - run: npm exec --yes --package=bb-app@0.48.1 -- bb plugin build .
        working-directory: plugins/oxi-op
      - run: git diff --exit-code

  provider-icons:
    needs: plan
    if: needs.plan.outputs.provider_icons == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/oxi-provider-icons/package-lock.json
      - run: npm ci
        working-directory: plugins/oxi-provider-icons
      - run: npm run typecheck
        working-directory: plugins/oxi-provider-icons
      - run: npm test
        working-directory: plugins/oxi-provider-icons
      # P0 recurrence guard: real Chromium hit-regression against the
      # live-DOM picker replica (1440 fine + 390 touch/coarse). Browser
      # install is allowed only here, on the ephemeral runner.
      - run: npx playwright install chromium --with-deps
        working-directory: plugins/oxi-provider-icons
      - run: node preview/tap-regression.mjs
        working-directory: plugins/oxi-provider-icons
      - run: npm exec --yes --package=bb-app@0.50.1 -- bb plugin build .
        working-directory: plugins/oxi-provider-icons
      - run: git diff --exit-code

  release-gate:
    if: always()
    needs: [plan, public-hygiene, secrets, check, upgrade-script, auto-archive, oxi-op, session-tree, cursor-gateway, provider-icons]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require all selected critical jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_release_gate.py
