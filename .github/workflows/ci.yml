name: CI

on:
  push:
    branches: [main]
    tags: ['account-pool-balanced/v*', 'automation-catalog/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          python-version: '3.12'
      - name: Check public paths and credentials
        run: python3 scripts/check_hygiene.py
      - name: Check documentation links
        run: python3 scripts/check_doc_refs.py

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        plugin: [account-pool-balanced, automation-catalog]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OXI_TEST_REMOTE_EXECUTION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - name: Check publication manifests
        run: node scripts/check-manifests.mjs
      - name: Install dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: npm ci
      - name: Typecheck
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run typecheck
      - name: Test
        working-directory: plugins/${{ matrix.plugin }}
        run: npm test
      - name: Collector tests
        if: matrix.plugin == 'automation-catalog'
        working-directory: plugins/automation-catalog/scripts
        run: python3 -m unittest test_catalog_collect test_catalog_history test_catalog_sync
      - name: Build with the published BB CLI
        working-directory: plugins/${{ matrix.plugin }}
        run: npm exec --yes --package=bb-app@0.43.3 -- bb plugin build .
      - name: Ensure checks leave tracked files clean
        run: git diff --exit-code

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan all fetched history
        run: /tmp/gitleaks-bin/gitleaks git --redact --no-banner --log-opts='--all' .
