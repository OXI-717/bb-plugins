name: Plugin tracking migration
on:
  pull_request:
    paths: ['scripts/plugin_tracking.py', 'scripts/test_plugin_tracking.py', '.github/workflows/plugin-tracking.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p test_plugin_tracking.py -v
